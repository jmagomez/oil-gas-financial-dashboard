name: Publica artefatos gerados
description: >
  Gate unico de publicacao: regenera os artefatos, roda a suite e so entao
  comita. Existia em triplicata nos workflows e ja havia divergido -- um
  rodava Python 3.11 e os outros 3.12 para o mesmo codigo, e apenas um fazia
  `git pull --rebase` antes do push -- os outros dois perdiam corrida
  silenciosamente.

inputs:
  mensagem:
    description: "Titulo do commit. Vazio = nao comita (so build + teste)."
    required: false
    default: ""
  corpo:
    description: "Corpo do commit (opcional)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Regenera os artefatos
      shell: bash
      run: python build_dashboard.py

    # A suite roda DEPOIS do build e ANTES do commit: ela confere as formulas
    # derivadas contra os artefatos recem-gerados, nao contra o estado antigo.
    # Nada e commitado se algo aqui quebrar.
    - name: Testes
      shell: bash
      run: pytest

    - name: Comita se houver mudanca
      if: inputs.mensagem != ''
      shell: bash
      env:
        MENSAGEM: ${{ inputs.mensagem }}
        CORPO: ${{ inputs.corpo }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # dashboard_data.json entra aqui junto dos outros gerados: sem isso
        # ele envelhece em silencio enquanto HTML e CSV seguem frescos --
        # e o `git pull --rebase --autostash` abaixo esconderia a mudanca
        # nao preparada em vez de comita-la.
        git add indicadores_oleo_gas.json dashboard_oleo_gas.html \
          indicadores_oleo_gas.csv dashboard_data.json
        if git diff --cached --quiet; then
          echo "Nada mudou -- nenhum commit."
          exit 0
        fi
        if [ -n "$CORPO" ]; then
          git commit -m "$MENSAGEM" -m "$CORPO"
        else
          git commit -m "$MENSAGEM"
        fi
        # Caso alguem tenha empurrado algo na main enquanto o job rodava.
        git pull --rebase --autostash
        git push
