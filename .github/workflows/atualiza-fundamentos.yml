name: Atualiza fundamentos

# Fundamentos (receita, EBITDA, capex, divida, producao) mudam so a cada
# balanco -- nao faz sentido rodar diariamente como os dados de mercado.
# Roda mensalmente na janela em que as sete empresas ja divulgaram, e fica
# disponivel sob demanda para quando um balanco sair fora do calendario.
#
# O disparo manual vem com dry_run = true marcado: a rotina mostra o que
# mudaria sem commitar nada. A simulacao AINDA roda build e testes -- so o
# commit e pulado --, porque uma simulacao que salta os dois nao exercita
# justamente o que poderia quebrar.

on:
  schedule:
    # 07:00 UTC no dia 5 de cada mes -- depois do grosso das divulgacoes.
    - cron: "0 7 5 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular: mostra o que mudaria, sem commitar"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fundamentos
  cancel-in-progress: false

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepara-ambiente
        with:
          coleta: "true"

      - name: Atualiza fundamentos
        run: |
          # bash -e sozinho nao propaga falha atraves do pipe para o tee:
          # sem pipefail, um erro na rotina sairia como sucesso no step.
          set -o pipefail
          python update_fundamentals.py ${{ inputs.dry_run && '--dry-run' || '' }} | tee saida.txt

      - uses: ./.github/actions/publica-artefatos
        with:
          mensagem: "${{ inputs.dry_run && '' || 'dados: atualiza fundamentos' }}"

      - name: Publica o resumo do run
        if: always()
        run: |
          echo "### Atualizacao de fundamentos" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat saida.txt >> "$GITHUB_STEP_SUMMARY" || echo "(sem saida)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
