name: Atualiza dados de mercado

# Cotacao, market cap, P/E, dividend yield e EV/EBITDA mudam todo pregao.
# Os fundamentos (receita, EBITDA, capex, divida, producao) continuam curados a
# mao a cada balanco -- esta rotina nao encosta neles.
#
# 22:00 UTC e depois do fechamento de Nova York o ano inteiro (o pregao fecha
# 21:00 UTC no horario de inverno e 20:00 UTC no de verao).
#
# Observacao sobre agendamento no GitHub: cron de Actions pode atrasar em
# horario de pico e e suspenso automaticamente apos 60 dias sem atividade no
# repositorio. Se o dashboard parar de atualizar, e o primeiro lugar para olhar.

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular: mostra o que mudaria, sem commitar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dados-mercado
  cancel-in-progress: false

jobs:
  atualiza:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepara-ambiente
        with:
          coleta: "true"

      # O caminho do relatorio usa $RUNNER_TEMP, a variavel de shell, e nao o
      # contexto ${{ runner.temp }}: o contexto `runner` nao existe no env de
      # job, so dentro dos steps -- por isso nao da para extrai-lo para uma
      # variavel la em cima.
      - name: Atualiza cotacao, market cap, P/E, dividend yield e EV/EBITDA
        run: |
          python3 update_market_data.py --relatorio "$RUNNER_TEMP/relatorio-mercado.json" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Resume o que mudou
        id: resumo
        run: |
          set -euo pipefail
          {
            echo "texto<<FIM"
            python3 - "$RUNNER_TEMP/relatorio-mercado.json" <<'PY'
          import json, sys

          rel = json.load(open(sys.argv[1], encoding="utf-8"))
          linhas = []
          for m in sorted(rel["mudancas"], key=lambda x: (x["ticker"], x["campo"])):
              var = f" ({m['var_pct']:+.2f}%)" if m["var_pct"] is not None else ""
              linhas.append(f"{m['ticker']} {m['campo']}: {m['antes']} -> {m['depois']}{var}")
          for r in rel["rejeicoes"]:
              linhas.append(f"[rejeitado] {r['ticker']} {r['campo']}={r['valor']}: {r['motivo']}")
          for f in rel["falhas"]:
              linhas.append(f"[sem dado] {f['ticker']}: {f['motivo']}")
          print("\n".join(linhas))
          PY
            echo "FIM"
            echo "data=$(date -u +%d/%m/%Y)"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/publica-artefatos
        with:
          mensagem: "${{ inputs.dry_run && '' || format('dados: atualiza mercado ({0})', steps.resumo.outputs.data) }}"
          corpo: ${{ steps.resumo.outputs.texto }}

      - name: Gera o corpo do e-mail
        run: python3 build_email.py --relatorio "$RUNNER_TEMP/relatorio-mercado.json" --pages-url "$PAGES_URL"

      - name: Envia o e-mail
        if: ${{ !inputs.dry_run && env.MAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD_OILANDGAS }}
          subject: "Oleo & Gas — dados de mercado"
          to: jmagomez@gmail.com
          from: "Dashboard Oleo & Gas"
          html_body: file://email_body.html

      - name: Guarda o relatorio da execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mercado
          path: ${{ runner.temp }}/relatorio-mercado.json
          if-no-files-found: ignore
          retention-days: 30
