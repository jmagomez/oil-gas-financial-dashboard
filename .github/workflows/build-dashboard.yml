name: Build dashboard (regenera HTML + CSV)

# Rede de seguranca para edicao humana: garante que dashboard_oleo_gas.html e
# indicadores_oleo_gas.csv fiquem SEMPRE sincronizados com o JSON curado.
# Dispara quando o JSON, o template ou o build script mudam por mao humana.
#
# Commits automaticos das rotinas de dados usam o GITHUB_TOKEN padrao e por
# isso NAO disparam este workflow (protecao anti-recursao do GitHub) -- as duas
# rotinas ja regeneram os artefatos elas mesmas, pelo mesmo composite action.

on:
  push:
    branches: [main]
    paths:
      - indicadores_oleo_gas.json
      - dashboard_template.html
      - build_dashboard.py
      - assets_a11y.css
      - assets_a11y.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepara-ambiente
      - uses: ./.github/actions/publica-artefatos
        with:
          mensagem: "build: regenera HTML/CSV a partir do JSON"
