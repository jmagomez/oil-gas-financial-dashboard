name: Deploy do dashboard (GitHub Pages)

# A origem do Pages e "GitHub Actions", nao mais um branch. Isso significa que
# NADA vai ao ar sem passar por aqui -- inclusive o dashboard_oleo_gas.html
# gerado pelo pipeline Python, que este workflow copia para a raiz do site.
# Remover essa copia derruba o dashboard que esta no ar.
#
#   /       dashboard_oleo_gas.html, gerado pelo pipeline
#   /app/   a camada React, enquanto as analises migram uma a uma
#
# O gate do app roda ANTES de montar o site: app que nao compila, nao passa no
# lint ou quebra um teste nao chega ao ar -- e, como aqui falhar significa site
# sem publicador, o passo final confere que o artefato tem o dashboard dentro.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A concorrencia e SEPARADA POR JOB, de proposito -- os dois tem necessidades
# opostas:
#
#   build  (gate)      cancela o que ficou obsoleto. Numa sequencia de pushes,
#                      so o ultimo commit importa para o que vai ao ar; rodar o
#                      gate inteiro em cada estado intermediario gasta tempo e
#                      enche o historico de vermelho que ninguem vai consertar,
#                      porque o commit ja foi superado.
#
#   deploy (publica)   NUNCA cancela. Interromper a ativacao do Pages no meio
#                      deixa o site servindo meio deploy, e isso nao tem volta.
#
# Isto veio de um caso concreto: oito runs vermelhas seguidas (#19 a #26) ao
# publicar arquivos interdependentes em commits separados. Nenhuma derrubou o
# site -- deploy-pages so ativa em caso de sucesso, entao o deploy anterior
# continuou servindo -- mas todas eram ruido evitavel. Com o cancelamento no
# build, cada push novo encerra o gate do anterior e so o estado final e
# avaliado. "Cancelado" e a semantica certa para commit superado; vermelho nao.
#
# O que isto NAO faz: tornar verde um commit quebrado. Se o ULTIMO push estiver
# quebrado, ele reprova -- e deve.

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20.11"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # O gate inteiro antes de qualquer build, com o mais rapido primeiro.
      - name: Instala dependencias
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Formatacao (prettier)
        working-directory: app
        run: npm run format:check

      - name: Testes
        working-directory: app
        run: npm run test

      - name: Build
        working-directory: app
        run: npm run build

      # Contra o JSON REAL da raiz, nao contra fixture: se o pipeline renomear
      # um campo, a falha acontece aqui e o site no ar continua sendo o ultimo
      # bom. Os avisos (trimestres diferentes, producao ausente, ROE baixo)
      # ficam no log do deploy de proposito.
      - name: Valida o contrato de dados
        working-directory: app
        run: npm run validate:data

      - name: Monta o site (raiz = pipeline, /app = React)
        run: |
          set -euo pipefail
          mkdir -p site/app/data
          cp index.html dashboard_oleo_gas.html site/
          cp indicadores_oleo_gas.json indicadores_oleo_gas.csv site/
          cp -r app/dist/. site/app/
          # O app busca ./data/indicadores_oleo_gas.json relativo a /app/.
          # Nao ha copia versionada dentro de app/: a fonte unica continua
          # sendo o arquivo da raiz, copiado aqui no momento da publicacao.
          cp indicadores_oleo_gas.json site/app/data/
          # O PAYLOAD ENRIQUECIDO, que e o que o app de fato consome: os 18
          # derivados, os eixos do radar e o TTM. Sem esta linha o app sobe e
          # falha no fetch -- e o gate acima nao pegaria, porque validate:data
          # confere o arquivo na RAIZ do repositorio, nao no artefato.
          cp dashboard_data.json site/app/data/
          # Guarda-chuva contra o erro mais caro deste workflow: publicar um
          # artefato sem o dashboard. Falhar mantem no ar o ultimo deploy bom;
          # publicar vazio nao tem volta.
          test -s site/dashboard_oleo_gas.html
          test -s site/index.html
          test -s site/indicadores_oleo_gas.json
          test -s site/app/index.html
          test -s site/app/data/indicadores_oleo_gas.json
          test -s site/app/data/dashboard_data.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Fila, nunca cancelamento: ver o comentario acima.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
